# Verification automatique a chaque envoi : le test de bout en bout demarre
# une instance isolee et deroule l'ensemble des routes.
name: Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installation des dependances
        run: npm ci --no-audit --no-fund

      - name: Analyse statique
        run: npm run lint

      - name: Test de bout en bout
        run: npm test

      - name: Vulnerabilites des dependances
        run: npm audit --omit=dev
