services:
  gameshelf:
    build: .
    image: gameshelf:latest
    container_name: gameshelf
    restart: unless-stopped

    # Le conteneur tourne sous l'utilisateur "node" (uid 1000).
    # Apres un premier lancement : sudo chown -R 1000:1000 ./data
    user: "1000:1000"

    # Accessible depuis le telephone et les autres machines du reseau local.
    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      # HTTPS auto-signe : necessaire pour la camera du telephone.
      ENABLE_HTTPS: ${ENABLE_HTTPS:-1}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}

    volumes:
      - ./data:/app/data

    healthcheck:
      # -k : le certificat local est auto-signe.
      test: ["CMD-SHELL", "curl -fsk https://127.0.0.1:3000/healthz || curl -fs http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true
