# Reverse proxy nginx pour GameShelf.
# Installe par deploy/install.sh --nginx <domaine>, puis certbot pour le HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Taille max d'un import CSV/JSON ou d'une jaquette.
    client_max_body_size 25M;

    access_log /var/log/nginx/gameshelf.access.log;
    error_log  /var/log/nginx/gameshelf.error.log;

    # Compression des reponses textuelles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Les jaquettes uploadees sont immuables : cache long cote navigateur.
    location /uploads/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
