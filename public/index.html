<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    interactive-widget=resizes-visual : quand le clavier du telephone
    s'ouvre, il recouvre la page sans la redimensionner. La mise en page ne
    bouge donc pas sous le doigt pendant une recherche.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="color-scheme" content="dark light">
  <title>GameVault</title>
  <meta name="description" content="Inventaire d'une collection de jeux vidéo physiques.">

  <script src="/js/theme.js"></script>
  <link rel="preload" href="/fonts/instrument-sans-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/anybody-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="modulepreload" href="/js/data.js">
  <link rel="modulepreload" href="/js/views.js">

  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="theme-color" content="#090d1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameVault">

  <script type="module" src="/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#results">Aller à la collection</a>

<header class="topbar">
  <div class="topbar-row">
    <a class="brand" href="/" data-action="home" aria-label="GameVault — toute la collection">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" class="brand-tile"/>
        <rect x="7" y="8" width="4.2" height="16" rx="1" class="brand-spine"/>
        <rect x="12.6" y="11" width="4.2" height="13" rx="1" class="brand-spine"/>
        <rect x="18.2" y="6" width="4.2" height="18" rx="1" class="brand-spine brand-spine--hot"/>
        <rect x="5" y="24.6" width="22" height="2.2" rx="1.1" class="brand-plank"/>
      </svg>
      <span class="brand-name">GameVault</span>
    </a>

    <div class="search" role="search">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="search-input" type="search" enterkeyhint="search"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="Titre, plateforme, serial, code-barres…" aria-label="Rechercher dans la collection">
      <button type="button" class="search-clear" id="q-clear" aria-label="Effacer la recherche" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>

    <div class="topbar-actions">
      <button type="button" class="btn btn--primary" data-action="scan" title="Est-ce que je l'ai ? (S)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>
        <span>Scanner</span>
      </button>
      <button type="button" class="btn" data-action="add" title="Ajouter un jeu (N)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Ajouter</span>
      </button>
      <button type="button" class="btn btn--icon" data-action="chat" data-needs-claude hidden title="Discuter avec Claude (C)" aria-label="Discuter avec Claude">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3 21l1.4-5.3A8.5 8.5 0 1 1 21 12z"/></svg>
      </button>
      <button type="button" class="btn btn--icon" data-action="stats" title="Bilan de la collection" aria-label="Bilan de la collection">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v2M11 10v7M15 6v11M19 12v5"/></svg>
      </button>
      <button type="button" class="btn btn--icon" data-action="menu" title="Import, export et thème" aria-label="Import, export et thème">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
    </div>
  </div>

  <!--
    La frise : toute la collection, une tranche par jeu, dans l'ordre d'une
    etagere et a l'epaisseur de son boitier. Elle reagit a la recherche sans
    jamais changer de taille. Doublon visuel de la liste, elle est ignoree
    des lecteurs d'ecran.
  -->
  <div class="strip-zone" aria-hidden="true">
    <div class="strip" id="strip"></div>
    <div class="strip-bubble" id="strip-bubble" hidden></div>
  </div>
</header>

<div class="layout">
  <aside class="filters" id="filters" aria-label="Filtres"></aside>

  <main class="main" id="main">
    <h1 class="visually-hidden">Collection de jeux vidéo</h1>

    <div class="toolbar">
      <div class="tally">
        <p class="tally-count" id="tally-count" aria-live="polite"></p>
        <p class="tally-sub" id="tally-sub"></p>
        <p class="net" id="net" hidden></p>
      </div>
      <div class="toolbar-controls">
        <button type="button" class="btn btn--ghost filters-toggle" data-action="filters">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
          <span>Filtres</span><span class="filters-badge" id="filters-badge" hidden></span>
        </button>
        <label class="select">
          <span class="visually-hidden">Trier par</span>
          <select id="sort"></select>
        </label>
        <div class="seg" role="radiogroup" aria-label="Affichage" id="views"></div>
      </div>
    </div>

    <div class="chips" id="chips"></div>

    <section class="results" id="results" tabindex="-1" aria-label="Jeux"></section>
  </main>
</div>

<!-- Barre du pouce, sur telephone : le scan au centre, a portee. -->
<nav class="tabbar" aria-label="Actions principales">
  <button type="button" class="tab" data-action="home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><rect x="4" y="5" width="3.5" height="16" rx=".6"/><rect x="9.2" y="8" width="3.5" height="13" rx=".6"/><rect x="14.4" y="4" width="3.5" height="17" rx=".6"/></svg>
    <span>Collection</span>
  </button>
  <button type="button" class="tab" data-action="stats">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v2M11 10v7M15 6v11M19 12v5"/></svg>
    <span>Bilan</span>
  </button>
  <button type="button" class="tab tab--scan" data-action="scan" aria-label="Scanner un code-barres">
    <span class="tab-scan-disc">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>
    </span>
    <span>Scanner</span>
  </button>
  <button type="button" class="tab" data-action="add">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Ajouter</span>
  </button>
  <button type="button" class="tab" data-action="menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
    <span>Plus</span>
  </button>
</nav>
</body>
</html>
