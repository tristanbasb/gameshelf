<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>GameShelf — ma collection de jeux</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="topbar">
  <button class="btn btn-ghost btn-icon sidebar-toggle" id="btn-sidebar" aria-label="Afficher les filtres">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="/" id="brand-home">
    <span class="brand-mark">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/>
        <line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/>
        <rect x="2" y="6" width="20" height="12" rx="5"/>
      </svg>
    </span>
    <span class="brand-label">GameShelf</span>
  </a>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="search" class="input" placeholder="Titre, plateforme, tag, code-barres…" autocomplete="off" aria-label="Rechercher">
  </div>

  <div class="topbar-actions">
    <button class="btn btn-primary" id="btn-scan" title="Scanner un code-barres">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/>
      </svg>
      <span class="hide-sm">Scanner</span>
    </button>

    <button class="btn" id="btn-add" title="Ajouter un jeu (n)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="hide-sm">Ajouter</span>
    </button>

    <button class="btn btn-ghost btn-icon" id="btn-io" title="Import / export" aria-label="Import et export">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>

    <button class="btn btn-ghost btn-icon" id="btn-theme" title="Changer de thème" aria-label="Changer de thème">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="icon-theme"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filter-group">
      <h3>Bibliothèque</h3>
      <div class="filter-list">
        <button class="filter-item active" data-quick="all">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Tous les jeux <span class="count" id="count-all"></span>
        </button>
        <button class="filter-item" data-quick="favorite">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 17.3-6.2 3.6 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"/></svg>
          Favoris <span class="count" id="count-fav"></span>
        </button>
        <button class="filter-item" data-quick="incomplete">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          Incomplets <span class="count" id="count-incomplete"></span>
        </button>
        <button class="filter-item" data-quick="noiso">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
          Sans ISO <span class="count" id="count-noiso"></span>
        </button>
      </div>
    </div>

    <div class="filter-group">
      <h3>État</h3>
      <div class="filter-list" id="filter-condition"></div>
    </div>

    <div class="filter-group">
      <h3>Plateforme</h3>
      <div class="filter-list" id="filter-platform"></div>
    </div>

    <div class="filter-group">
      <h3>Région</h3>
      <div class="filter-list" id="filter-region"></div>
    </div>

    <div class="filter-group">
      <h3>Tags</h3>
      <div class="filter-list" id="filter-tags"></div>
    </div>
  </aside>

  <main class="main">
    <div class="chips" id="active-filters"></div>

    <div class="toolbar">
      <span class="result-count" id="result-count"></span>
      <div class="spacer"></div>

      <select class="select" id="sort" style="width:auto" aria-label="Trier par">
        <option value="created_at:desc">Ajout récent</option>
        <option value="created_at:asc">Ajout ancien</option>
        <option value="title:asc">Titre (A→Z)</option>
        <option value="title:desc">Titre (Z→A)</option>
        <option value="quantity:desc">Quantité décroissante</option>
        <option value="platform:asc">Plateforme</option>
      </select>

      <select class="select" id="page-size" style="width:auto" aria-label="Nombre de jeux par page">
        <option value="60">60 par page</option>
        <option value="120">120 par page</option>
        <option value="240">240 par page</option>
        <option value="all">Tout afficher</option>
      </select>

      <div class="view-toggle" role="group" aria-label="Mode d'affichage">
        <button id="view-grid" class="active" title="Grille" aria-label="Vue grille">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button id="view-table" title="Tableau" aria-label="Vue tableau">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>

    <div id="games-container" aria-live="polite"></div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<!-- Scan au pouce : sur telephone, le geste principal ne doit pas obliger
     a viser le haut de l'ecran. Masque sur grand ecran. -->
<button class="fab" id="btn-scan-fab" aria-label="Scanner un code-barres">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
    <path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/>
  </svg>
</button>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- ======================= Modale : scan d'un code-barres ======================= -->
<template id="tpl-scan-modal">
  <div class="modal-backdrop" data-close-on-backdrop>
    <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="scan-title">
      <div class="modal-head">
        <h2 id="scan-title">Scanner un code-barres</h2>
        <button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="scanner" id="scanner-frame">
          <video id="scanner-video" playsinline muted></video>
          <div class="scanner-reticle"></div>
        </div>
        <p class="scanner-status" id="scanner-status">Démarrage de la caméra…</p>

        <div class="field" style="margin-top:14px">
          <label for="scan-manual">Ou saisir le code à la main</label>
          <div style="display:flex; gap:8px">
            <input class="input" id="scan-manual" inputmode="numeric" autocomplete="off"
                   placeholder="3307210000000" maxlength="14">
            <button type="button" class="btn" id="btn-scan-manual">Chercher</button>
          </div>
        </div>

        <div id="scan-result" style="margin-top:16px"></div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn" data-close>Fermer</button>
      </div>
    </div>
  </div>
</template>

<!-- ======================= Modale : fiche de jeu ======================= -->
<template id="tpl-game-modal">
  <div class="modal-backdrop" data-close-on-backdrop>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="game-modal-title">
      <div class="modal-head">
        <h2 id="game-modal-title">Ajouter un jeu</h2>
        <button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="game-form" novalidate>
        <div class="modal-body">
          <div class="form-grid">
            <div class="field full">
              <label for="f-title">Titre *</label>
              <div style="display:flex; gap:8px">
                <input class="input" id="f-title" name="title" required maxlength="200" autocomplete="off">
                <button type="button" class="btn" id="btn-lookup" hidden title="Récupérer les infos en ligne">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                  <span class="hide-sm">En ligne</span>
                </button>
              </div>
              <div id="lookup-results"></div>
            </div>

            <div class="field">
              <label for="f-platform">Plateforme</label>
              <input class="input" id="f-platform" name="platform" list="dl-platforms" autocomplete="off" placeholder="PS5, Switch, PC…">
              <datalist id="dl-platforms"></datalist>
            </div>

            <div class="field">
              <label for="f-region">Région</label>
              <input class="input" id="f-region" name="region" list="dl-regions" autocomplete="off" placeholder="PAL, NTSC-U, NTSC-J…">
              <datalist id="dl-regions">
                <option value="PAL"></option>
                <option value="NTSC-U"></option>
                <option value="NTSC-J"></option>
                <option value="NTSC"></option>
              </datalist>
            </div>

            <div class="field">
              <label for="f-serial">Serial</label>
              <input class="input" id="f-serial" name="serial" autocomplete="off" placeholder="SLES52237, SCES51910/P…">
            </div>

            <div class="field">
              <label for="f-ean">Code-barres (EAN)</label>
              <div style="display:flex; gap:8px">
                <input class="input" id="f-ean" name="ean" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="8 à 14 chiffres">
                <button type="button" class="btn btn-icon" id="btn-scan-field" title="Scanner" aria-label="Scanner le code-barres">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/></svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label for="f-quantity">Quantité (exemplaires)</label>
              <input class="input" id="f-quantity" name="quantity" type="number" min="1" max="9999" step="1" value="1" inputmode="numeric">
            </div>

            <div class="field">
              <label for="f-condition">État</label>
              <select class="select" id="f-condition" name="condition">
                <option value="">Non renseigné</option>
                <option value="sealed">Neuf</option>
                <option value="mint">Très bon</option>
                <option value="good">Bon</option>
                <option value="fair">Acceptable</option>
                <option value="poor">Mauvais</option>
              </select>
            </div>

            <div class="field full" id="parts-block">
              <label>Ce que contient l'exemplaire</label>
              <div class="parts-grid">
                <label class="switch"><input type="checkbox" id="f-has_box" checked><span>Boîte</span></label>
                <label class="switch"><input type="checkbox" id="f-has_cover_art" checked><span>Jaquette papier</span></label>
                <label class="switch"><input type="checkbox" id="f-has_manual" checked><span>Notice</span></label>
                <label class="switch"><input type="checkbox" id="f-has_disc" checked><span>Disque / cartouche</span></label>
              </div>
              <span class="hint">Décochez ce qui manque : le jeu apparaîtra dans la vue « Incomplets ».</span>
            </div>

            <div class="field full">
              <div class="parts-grid">
                <label class="switch"><input type="checkbox" id="f-has_iso"><span>J'ai l'ISO</span></label>
                <label class="switch"><input type="checkbox" id="f-favorite" name="favorite"><span>Favori</span></label>
              </div>
            </div>

            <div class="field full">
              <label for="f-tags">Tags</label>
              <input class="input" id="f-tags" name="tags" placeholder="coop, collector, à revendre — séparés par des virgules" autocomplete="off">
            </div>

            <div class="field full">
              <label for="f-notes">Notes</label>
              <textarea class="textarea" id="f-notes" name="notes" maxlength="8000" placeholder="État de la boîte, où il est rangé, pièces manquantes…"></textarea>
            </div>

            <div class="field full">
              <label>Visuel</label>
              <div class="cover-picker">
                <div class="cover-preview" id="cover-preview">Aucune image</div>
                <div class="cover-fields">
                  <input class="input" id="f-cover" name="cover_url" placeholder="https://… ou téléversez un fichier" autocomplete="off">
                  <div style="display:flex; gap:8px; flex-wrap:wrap">
                    <button type="button" class="btn" id="btn-upload">Téléverser une image</button>
                    <button type="button" class="btn btn-ghost" id="btn-clear-cover">Retirer</button>
                  </div>
                  <input type="file" id="file-cover" accept="image/*" hidden>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-danger left" id="btn-delete" hidden>Supprimer</button>
          <button type="button" class="btn" data-close>Annuler</button>
          <button type="button" class="btn" id="btn-save-again" hidden title="Enregistre et garde la plateforme et l'état pour le jeu suivant">
            Enregistrer et suivant
          </button>
          <button type="submit" class="btn btn-primary" id="btn-save">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</template>

<!-- ======================= Modale : import / export ======================= -->
<template id="tpl-io-modal">
  <div class="modal-backdrop" data-close-on-backdrop>
    <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="io-title">
      <div class="modal-head">
        <h2 id="io-title">Import / export</h2>
        <button class="btn btn-ghost btn-icon" data-close aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <h3 style="font-size:14px; margin-bottom:10px">Exporter ma collection</h3>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px">
          <a class="btn" href="/api/export?format=csv" download>Fichier CSV</a>
          <a class="btn" href="/api/export?format=json" download>Fichier JSON</a>
          <a class="btn" href="/api/backup" download title="Copie complète de la base SQLite">Sauvegarde .db</a>
        </div>

        <h3 style="font-size:14px; margin-bottom:10px">Importer</h3>
        <p style="color:var(--text-muted); font-size:13px; margin:0 0 12px">
          Fichier CSV ou JSON. La première ligne d'un CSV donne les en-têtes.
          Sont reconnus : <code>titre, plateforme, région, état, serial, ean,
          quantité, complet, iso, favori, tags, notes</code>.
          La colonne <code>complet</code> accepte <code>Oui</code>, <code>Non</code>
          ou la liste de ce qui est présent (<code>CD, Boîte</code>).
        </p>

        <div class="field" style="margin-bottom:12px">
          <label for="import-platform">Plateforme par défaut</label>
          <input class="input" id="import-platform" list="dl-platforms" autocomplete="off"
                 placeholder="ex. PlayStation 2 — pour un fichier d'une seule console">
          <span class="hint">Utilisée pour les lignes sans colonne « plateforme ».</span>
        </div>

        <div class="field" style="margin-bottom:12px">
          <label for="import-mode">Mode</label>
          <select class="select" id="import-mode">
            <option value="merge">Ajouter à la collection (ignore les doublons titre + plateforme)</option>
            <option value="replace">Remplacer entièrement la collection</option>
          </select>
        </div>

        <input type="file" id="import-file" accept=".csv,.json,text/csv,application/json" class="input">
        <div id="import-report" style="margin-top:12px"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" data-close>Fermer</button>
        <button type="button" class="btn btn-primary" id="btn-do-import">Importer</button>
      </div>
    </div>
  </div>
</template>

<!-- ======================= Modale : confirmation ======================= -->
<template id="tpl-confirm-modal">
  <div class="modal-backdrop" data-close-on-backdrop>
    <div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-head">
        <h2 id="confirm-title">Confirmation</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-text" style="margin:0"></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" data-close>Annuler</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">Confirmer</button>
      </div>
    </div>
  </div>
</template>

<script type="module" src="/js/app.js"></script>
</body>
</html>
