<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Connexion — GameShelf</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="brand">
      <span class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/>
          <line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/>
          <rect x="2" y="6" width="20" height="12" rx="5"/>
        </svg>
      </span>
      <span>GameShelf</span>
    </div>
    <p class="subtitle">Votre collection de jeux vidéo</p>

    <div class="form-error" id="error" hidden></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Identifiant</label>
        <input class="input" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" id="submit">Se connecter</button>
    </form>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
